name: build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    name: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Prepare environment
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip libtool-bin libtool libltdl-dev curl cmake gperf gawk flex bison xxd fakeroot cpio git python3-docutils gettext automake autopoint texinfo build-essential help2man pkg-config zlib1g-dev libgmp-dev libmpc-dev libmpfr-dev libncurses-dev wget libc-dev-bin

      - name: Prepare toolchain
        run: |
          cd toolchain-mipsel
          sh dl_toolchain.sh

      - name: Build K2P pure AP firmware
        run: |
          cd trunk
          fakeroot ./build_firmware_ci K2P_nano

      - name: Generate checksums
        run: |
          cd trunk/images
          ls -lh
          sha256sum *.trx | tee sha256sum.txt
          md5sum *.trx | tee md5sum.txt

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: K2P_pure_AP
          path: |
            trunk/images/*.trx
            trunk/images/*.txt
